# Production deployment for Gapswise. Secret values are never stored here.
# Supply the blank public Firebase/OAuth substitutions from a Cloud Build
# trigger or from gcloud builds submit. They are public browser configuration,
# not credentials; OAuth/internal secrets are attached from Secret Manager at
# Cloud Run runtime.

substitutions:
  _REGION: us-central1
  _WEB_URL: https://gapswise-web-r3zqs7f2gq-uc.a.run.app
  _AGENT_URL: https://gapswise-agent-r3zqs7f2gq-uc.a.run.app
  _GEMINI_MODEL: gemini-2.5-flash-lite
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ''
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ''
  _NEXT_PUBLIC_FIREBASE_APP_ID: ''
  _GOOGLE_OAUTH_CLIENT_ID: ''

steps:
  - id: validate-production-substitutions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        for value in \
          "${_NEXT_PUBLIC_FIREBASE_API_KEY}" \
          "${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" \
          "${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
          "${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}" \
          "${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}" \
          "${_NEXT_PUBLIC_FIREBASE_APP_ID}" \
          "${_GOOGLE_OAUTH_CLIENT_ID}"; do
          test -n "${value}" && test "${value}" != "..." || {
            echo "Missing required production substitution. Configure the Cloud Build trigger or submit command." >&2
            exit 1
          }
        done

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-production-substitutions]
    args:
      - build
      - --file=Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-web:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - .

  - id: build-agent
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-production-substitutions]
    dir: agent-service
    args:
      - build
      - --file=Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-agent:$BUILD_ID
      - --build-arg
      - AGENT_VERSION=$BUILD_ID
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-web:$BUILD_ID

  - id: push-agent
    name: gcr.io/cloud-builders/docker
    waitFor: [build-agent]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-agent:$BUILD_ID

  - id: deploy-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-agent]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gapswise-agent
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-agent:$BUILD_ID
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=gapswise-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --min=0
      - --max=3
      - --cpu=1
      - --memory=1Gi
      - --concurrency=4
      - --cpu-throttling
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_EVAL_MODEL=${_GEMINI_MODEL},GAPSWISE_APP_URL=${_WEB_URL},AGENT_VERSION=$BUILD_ID,ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS=false
      - --set-secrets=GAPSWISE_INTERNAL_API_SECRET=gapswise-internal-api-secret:latest

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-web, deploy-agent]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gapswise-web
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gapswise-web:$BUILD_ID
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=gapswise-web-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --min=0
      - --max=3
      - --cpu=1
      - --memory=1Gi
      - --concurrency=40
      - --cpu-throttling
      - --set-env-vars=GAPSWISE_DEMO_MODE=false,USE_FIRESTORE=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,GEMINI_MODEL=${_GEMINI_MODEL},FIRESTORE_DATABASE_ID=(default),CLOUD_STORAGE_BUCKET=gapwise-505217-context,GAPSWISE_APP_URL=${_WEB_URL},GAPSWISE_AGENT_URL=${_AGENT_URL},GAPSWISE_AGENT_AUTH=true,GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID},GOOGLE_OAUTH_REDIRECT_URI=${_WEB_URL}/api/integrations/google/calendar/callback,NEXT_PUBLIC_DEMO_MODE=false,NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --set-secrets=GAPSWISE_INTERNAL_API_SECRET=gapswise-internal-api-secret:latest,GOOGLE_OAUTH_CLIENT_SECRET=gapswise-google-oauth-client-secret:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
